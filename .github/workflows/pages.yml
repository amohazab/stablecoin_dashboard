# Step 9 (P-9.01): publish the committed out/site/ to GitHub Pages. No build step,
# no secrets, no API. Action versions are named defaults, not searched for. P-8.04 Q10: a
# push to master that changes out/site/** deploys too; any other push deploys nothing.
name: pages
on: { workflow_dispatch: {}, push: { branches: [master], paths: ["out/site/**"] } }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: out/site }
      # Polish (Amin): one retry after 60 s when the deploy step fails (36473005772 lost its
      # artifact lookup once); P-9.02's action versions are unchanged.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
