# ---- Frozen-pool factory indices: SIGNED 2026-09-07 -----------------------
# DET-10(d)-ii's disappearance test, factory-side. Per run:
# `factory_root.pool_list(index)` at run_block must equal `pool`; anything else
# - a different address, a revert, or pool_count() <= index - is the
# disappearance event. This is the rubric's letter ("absent from on-chain
# factory enumeration"), not the pool's self-report.
#
# `pool.factory()` was tried first and REJECTED: it reverts on 3 of the 5
# frozen pools, whose classes carry `derivation_route = "candidate -> closure"`
# above, and treating a revert as disappearance would have fired T-10 Level 2
# on frxUSD (17.5% of freeze coverage) at the first run.
#
# SAFE BECAUSE `pool_list` IS APPEND-ONLY, verified from the verified source of
# all three factories at review time, not from recall:
#   * pool_factory_crvusd (Vyper_contract): writes at l.581, 663, 932, each
#     `self.pool_list[length] = pool` with `length = self.pool_count`, followed
#     by `self.pool_count = length + 1` (l.582, 664) or, in the batch
#     `add_existing_metapools` path, `length += 1` per pool then
#     `self.pool_count = length` (l.975) - still only indices >= the old count.
#   * pool_factory_stable_ng (CurveStableswapFactoryNG): writes at l.542, 661,
#     same shape, counts at l.543, 662.
#   * pool_factory_old (Vyper_contract): writes at l.573, 655, 911; counts at
#     l.574, 656, 954.
#   * ZERO matches in any of the three for a deletion, a reorder, a
#     `pool_count` decrement, or a `pool_list[i] = empty` - no function exists
#     that removes or reorders. An index is therefore stable for the life of
#     the factory.
#
# Located by a one-time `pool_list` walk over the frozen set's three DECLARED
# scope classes at block 25927843 - 1,470 reads, once, outside the run path.
# Cross-check: index 510 reproduces `pool_factory_stable_ng`'s signed
# closure_evidence, "pointer at index 510".
#
# RETIRES AT THE R-a1 REFRESH: the regenerated set file should carry each
# pool's index itself, at which point this table is redundant. The refresh's
# job, built nowhere here.

