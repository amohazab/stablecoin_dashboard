# ---- ETH/USD heartbeat: OWED, deliberately absent --------------------------
# T-26's heartbeat for the Chainlink ETH/USD feed is off-chain metadata and
# needs a dated analyst value (data.chain.link). None was supplied at signature,
# so NO ROW EXISTS and the oracle row carries `heartbeat_s = None` with its
# adapter class naming why (P-4.13 R4, FR-L05). Present-and-empty, never zero.

# ---- reference feeds: none, by structure ------------------------------------
# DET-55's gap column compares a protocol oracle against an independent market
# feed. LUSD's PriceFeed IS the Chainlink ETH/USD aggregator, so there is no
# second feed to compare it to and the row carries `no_reference_feed` —
# a structural fact, not a missing config row.
