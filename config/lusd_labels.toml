# LUSD label config — SIGNED 2026-09-10 (P-4.16).

schema_version = 1

# ---- §4 node rows (DET-02) --------------------------------------------------
# ONE node. Liquity v1 accepts ETH and nothing else, so any second node is an
# adapter bug and routes to §8.2 quarantine (LUSD sheet).
#
# NATIVE ETH HAS NO CONTRACT, and the schema is address-keyed by the first hard
# gate — so ETH needs a key. Ruled P-4.13 R2 to Curve's own convention,
# 0xEeee...EEeE, which this repo's catalog data already carries. `eth_getCode`
# at that address is EMPTY (verified, block 25946704): the key is a NAME, never
# a contract to read. The ETH figure comes from ActivePool.getETH() +
# DefaultPool.getETH(), never from a balance at this address.
[[node]]
address = "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
symbol = "ETH"
label = "terminal"
node_class = "volatile"
lst_discount_applies = false
label_source = "memo 4.5 `ETH (native)` row, which names LUSD explicitly; LUSD sheet node table"
date = 2026-09-10

# ---- paired assets (DET-11) -------------------------------------------------
# THE REPO'S FIRST COMPOSITE (memo §4.3). 3CRV is an LP token, not a stable.
# The memo's rule: an LP token whose constituents are ALL §4-labeled passes
# through pro-rata to those constituents AT THE POOL'S CURRENT COMPOSITION — a
# data field read at the run's block. So the composition is NOT recorded here:
# the three constituent rows below give the labels, and 3pool `balances(i)` at
# `run_block` gives the weights. Memo §4.3 explicitly REJECTS labeling the LP
# token `recurses_truncated`, so it carries no four-state label of its own.
# Guard: if any constituent were unlisted, the LP token would be unlisted.
[[paired_asset]]
