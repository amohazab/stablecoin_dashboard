# USDe label config — from the signed sheet (intake-sheet-usde.md, bf64d756), P-10.05.
#
# Two tables (E6). `[[node]]`: the six disclosure-category nodes, keyed by
# `category` + `attestation_ref` in place of `address` (exactly one of the two,
# DET-02 per A-44); tree weight comes from these alone (D1). `[[label_row]]`:
# the assets the backing-assets route lists, keyed by symbol, zero tree weight;
# they give Liquid Stables its staleness and feed the §2 reconciliation.
# node_class = stable on every node, lst_discount_applies = false (Q43).

schema_version = 1

[[node]]
category = "Crypto Basis"
attestation_ref = "custodian-attestations-of-assets-backing-usde-september-3"
label = "recurses"
node_class = "stable"
lst_discount_applies = false
label_source = "memo #2 §4.5 Crypto Basis row; intake-sheet-usde.md, Backing nodes"
date = 2026-10-25

