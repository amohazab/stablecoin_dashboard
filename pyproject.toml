[project]
name = "stable-dashboard"
version = "0.1.0"
description = "Stablecoin structural risk report factory - crvUSD adapter (Step 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "web3>=7.0,<8",
    "pydantic>=2.7,<3",
    "requests>=2.31,<3",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
