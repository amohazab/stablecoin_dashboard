what_this_is = "An automated structural risk report on {token}: every number below is read from Ethereum at block {block} and can be reproduced ({verify})."
behavioral_tier = "The behavioral tier — how the token trades: peg deviation, liquidity, holder concentration and flows — will come from an external monitoring service and is pending."
