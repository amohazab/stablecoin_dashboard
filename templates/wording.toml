methodology_reader = "The behavioral tier shows how each token trades: how far its price has strayed from the peg over the last seven days, how much DEX liquidity Webacy counts for it, how its supply changed over seven days, and how concentrated its holders are. It comes from Webacy, an external monitoring service, and is fetched at a timestamp printed on each page. Unlike the structural figures, it is not read at the report's block, and this pipeline neither computes nor verifies it."
methodology_sources = "Sources for the behavioral tier"
hci_history = "Holder-concentration history is not offered by Webacy's API: its OpenAPI specification (v1.7.3) has no history endpoint or parameter for /rwa/hci, so no concentration chart is drawn."
endpoints = [["/rwa/{address}?chain=eth&hours=168", "the depeg snapshot, its seven-day history, DEX liquidity (total and depth tier) and the Ethereum DEX pools list"], ["/rwa/hci?chain=eth&pageSize=500", "holder concentration, matched by contract address"], ["/rwa/supply/{symbol}", "the net supply change over 7, 30 and 90 days, used only when the returned row's Ethereum address is the token's"]]

# R3 (P-8.02 review): one sentence per Webacy HCI note value; an unknown value renders
# nothing and is listed in site.json.
[behavioral.notes]
all_top_n_are_protocol_contracts_organic_low = "Webacy counts the largest holders as protocol contracts, so it rates concentration as low."

# R11: the six stat cards of "How it trades", each with its "?" tooltip.
[behavioral.cards]
price = "Peg price"
price_tip = "Webacy's latest price for the token, against its $1 peg."
deviation = "Deviation from peg"
deviation_tip = "How far that price sits from the peg, in basis points (100 bp = 1%)."
score = "Webacy depeg score"
score_tip = "Webacy's 0–100 depeg risk score; higher is riskier. Its tiers: ok 0–24, watch 25–49, warning 50–69, critical 70–100."
liquidity = "DEX liquidity"
liquidity_tip = "Liquidity Webacy counts for the token across decentralised-exchange pools, with its depth tier."
supply = "Supply change, 7 days"
supply_tip = "Net tokens minted less burned over seven days, per Webacy."
supply_tip_base = "Net tokens minted less burned over seven days, per Webacy; the % is of Webacy's circulating supply 7 days earlier ({base})."
holders = "Top-10 holder share"
holders_tip = "Share of supply held by the ten largest holders, with Webacy's risk band."

