why_scenario = "The headline scenario is a 50% fall in the price of volatile collateral, with no extra discount on liquid-staking tokens and liquidity providers staying put — the one scenario the archetype memo names as the headline (memo §6.2.6)."
headline_sentence = "In that scenario liquidations leave {bad_debt} of bad debt ({pct} of supply) and require selling {sold} into {exit} of exit liquidity."
structural_zero_sentence = "In that scenario liquidations leave {bad_debt} of bad debt ({pct} of supply) — structurally zero on this grid, because {reason} — and require selling {sold} into {exit} of exit liquidity."
oracle_lag = "Prices may lag the market by up to {x}: the largest update threshold among this token's price feeds ({feed})."
oracle_lag_ema = "Prices follow exponential moving averages of pool prices, so they lag the market by design; the window per market is in the oracle table."
