reading_over = "forced sales need more than all available exit liquidity ({ratio})"
reading_exhausted = "no exit liquidity is left"
swatches = [["s0", "0"], ["s1", "under 0.1%"], ["s2", "under 10%"], ["s3", "under 100%"], ["s4", "100% or more"], ["exhausted", "exit exhausted"]]

[labels]
# B-13 ruling I: the three backing classes describe how backing can be checked; all three are backing.
bar_terminal = "backing held in assets whose value can be checked directly on-chain"
bar_terminal_other_layer = "backing held in wrapped assets whose value can be checked on-chain one layer down, through the wrapper"
node_bar = "the backing class this collateral is counted in (terminal: checkable on-chain; terminal_other_layer: checkable one layer down, through the wrapper; disclosure_dependent: checked through published disclosures)"
bar_disclosure_dependent = "backing whose value is checked through an issuer's or custodian's published disclosures"
ema_lag_readings = "collateral coverage after the shock under instant vs lagged prices, per shock level"
supply = "Supply"
originated = "originated"
residual = "residual"
named_causes = "named causes"
supply_card = "Supply"
bad_debt_card = "Bad debt, headline scenario"
exit_card = "Exit liquidity, headline scenario"
m1_pre = "collateral coverage before the shock"
m1_post = "collateral coverage after the shock"
m1_gap = "coverage restored by the liquidation mechanism"
m2_bad_debt = "bad debt"
m2_pct_supply = "bad debt as a share of supply"
m3_forced_sell_volume = "collateral that must be sold"
m3_exit_depth = "exit liquidity"
m3_ratio = "forced sales ÷ exit liquidity"
# Previews ruling 5 (and, for the Member-2 headline rows, a named default of the Builder).
root_backing_value = "value of all backing collateral"
root_backed_supply = "supply backed by the traced collateral"
m2_headline_m3_forced_sell_volume = "forced sales in the Member-2 headline depeg scenario (paired stablecoin at its middle target, no liquidity-provider flight)"
m2_headline_m3_exit_depth = "exit liquidity in the Member-2 headline depeg scenario"
m2_headline_m3_ratio = "forced sales ÷ exit liquidity in the Member-2 headline depeg scenario"
# Run 8 ruling 4: metric-4 labels drafted from the stress module's definitions
# (gho_cells.py, lusd_cells.py; memo §6.3) - what each figure measures, nothing more.
binding_side = "which side binds liquidation capacity first: the GHO liquidators can source, or the collateral they can sell"
gho_sourceable = "GHO liquidators can source within the liquidation bonus: pool buy-side depth plus the GSMs' remaining mint headroom"
collateral_sellable = "collateral liquidators can sell within the liquidation bonus, bounded by the analyst's dated sell-side capacity"
gsm_mint_headroom = "GHO the GSMs can still mint before their exposure caps bind; one part of the GHO liquidators can source"
facilitator_bucket_levels = "GHO minted by each facilitator, which its bucket cap bounds; the cap limits recovery minting, not liquidation"
freezer_state = "the GSM's freezer routing: freezer_effective means the freezer can act, which removes that GSM from exit liquidity in a depeg scenario; in a collateral crash the GSM stays an exit venue"
counterfactual_ref = "the counterfactual lines printed with this scenario"
exit_depth_cell = "exit liquidity in this scenario"
lp_flight_share = "share of liquidity providers leaving in this scenario"
sp_effective_cell = "Stability Pool balance available to absorb liquidations in this scenario: the balance less the scenario's liquidity-provider flight share"
redistributed_debt = "debt passed to surviving troves when the Stability Pool cannot absorb it; a reallocation, not an absorption"
redistributed_positions_below_100 = "redistributed trove debt left below full collateral, which is how bad debt is defined for LUSD"
tcr_post = "system collateral ratio after the shock"
recovery_mode_flag = "whether the system collateral ratio after the shock is below the Recovery Mode threshold"
redemption_capacity = "LUSD that can be redeemed against troves before the redemption fee reaches its ceiling, or the reason none is counted"
effective = "PegKeeper headroom that can actually be used"
naive = "PegKeeper headroom by debt ceilings alone"

