# Template-owned reader wording (P-7.01 R19; R-B11.2). Plain English, no rubric
# IDs. No figure here - every number comes from table.json / grid.json through fmt.

what_this_is = "An automated structural risk report on {token}: every number below is read from Ethereum at block {block} and can be reproduced ({verify})."
