# Template-owned reader wording (P-7.01 R19; R-B11.2). Plain English, no rubric
# IDs. No figure here - every number comes from table.json / grid.json through fmt.

what_this_is = "An automated structural risk report on {token}: every number below is read from Ethereum at block {block} and can be reproduced ({verify})."
behavioral_tier = "The behavioral tier — how the token trades: peg deviation, liquidity, holder concentration and flows — will come from an external monitoring service and is pending."
structural_only = "This report is the structural tier only: what backs the token, how far that backing can be checked on-chain, and how it holds up under stress."
reference_prices = "Independent market reference prices are not available from a pinned source in this pilot ({n} collaterals)."
why_scenario = "The headline scenario is a 50% fall in the price of volatile collateral, with no extra discount on liquid-staking tokens and liquidity providers staying put — the one scenario the archetype memo names as the headline (memo §6.2.6)."
headline_sentence = "In that scenario liquidations leave {bad_debt} of bad debt ({pct} of supply) and require selling {sold} into {exit} of exit liquidity."
structural_zero_sentence = "Bad debt is structurally zero on the whole grid: {reason}"
oracle_lag = "Prices may lag the market by up to {x}: the largest update threshold among this token's price feeds ({feed})."
oracle_lag_ema = "Prices follow exponential moving averages of pool prices, so they lag the market by design; the window per market is in the oracle table."
check_this = "Every figure on this page comes from one data table built from on-chain reads at a single block. Reproduce any of them from the verify page."
specialists = "Detail for specialists"
flag = "Notice: {name} — entry {id}, first fired {date}"
behavioral_pending = "behavioral tier: pending"

[pills]
fresh_days = 30
stale_days = 92
freshness = "Disclosures {avg} old on average · worst {worst}, {days} old, {share} of backing"
freshness_none = "No collateral depends on off-chain disclosures"
governance = "Rule changes: {delay}"
governance_immutable = "Rules cannot be changed: immutable contracts"
flags_none = "No warnings this run"
flags = "{n} notice(s): {names}"

# B-11c (DET-89): triggers whose rubric name carries a threshold figure; the pill
# names the token's own value instead, through fmt.
[trigger_pill]
T-02 = "off-venue share {exit.offvenue.x}"

# B-11c: the rubric's literals, placed where their clauses name them, inside the
# specialist layer (R-B11.1 keeps the reader layer plain).
[rubric]
lp_sticky_line = "Headline exit liquidity {exit} — LP capital assumed sticky."
lp_grid_line = "LP-flight grid 0% / 30% / 60% — assumed scenario modifier, not data-derived."
lp_rule_line = "Modeling rule: single-sided withdrawal of the paired asset."
freeze_line = "modeled pools: the largest pools covering 90% of the frozen set, which itself covered 95% of discovered on-Curve liquidity at freeze time ({date})."
k_share = "K-subset share of the frozen set: {share}"
observation_exact = "instant observation — nearly exact: Chainlink deviation triggers ≤ {x}"
observation_weaker = "instant observation — weaker for {nodes}: deviation {x}; shock cells at ≥ 20% still trigger immediately; residual error ≤ {x}"
observation_ema = "instant observation — knowingly optimistic: LLAMMA prices off an EMA oracle; see counterfactual line EMA_lag"
scope_manipulation = "oracle manipulation out of scope — feed control reported under the admin-power surface (the oracle settings rows of the admin-power table)."
scope_failure = "oracle failure/staleness out of scope."
scope_failure_tellor = "oracle failure/staleness: see the Tellor_fallback counterfactual line."
scope_sequencer = "sequencer/infra risk n/a — mainnet only."
audit_status = "Audit status as of {date}."
tag_date = "(analyst-supplied {date})"
slice_row = "protocol stabilizer debt"
ceiling_row = "ceiling aggregate — the upper bound of the protocol stabilizer slice"
net_position_line = "Net position of each stabilizer operation: pro-cyclical, non-credited; valued at par."

# B-12 (DET-58): the page place a flag renders in, per rubric §3 `section`. NAMED
# DEFAULT: "exit liquidity" flags sit under "What could break it", "stress (Member 2)"
# in the exit-liquidity details, "mechanism state" in the headline details.
[flag_section]
verifiability = "backing"
supply = "finding"
"exit liquidity" = "break"
"mechanism state" = "headline"
"stress (Member 2)" = "chart_b"
header = "pills"
"oracle table" = "oracle"

# B-12 (DET-59): the rubric's banner literals; "none yet" until a report publishes (R16).
[banner]
last = "Last successful run: {date}"
current = "Current run: quarantined — {category}"
review = "Under review — last successful run {date}"
none = "none yet"

[governance]
immutable = "No one can change the rules: the contracts are immutable."
all_none = "No one holds any admin power: every contract is immutable and ownership was renounced."
veto = "a veto holder can cancel the change"

[holders]
