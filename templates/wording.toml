stock_only = "Capacity is measured as a stock at the run block; how each mechanism's stock-only reading errs is the bias table below."
observation = "Prices are taken as observed instantly at the run block; the oracle table lists each feed's update condition."
lp_sticky = "Liquidity providers are assumed to stay in their pools unless a scenario applies the liquidity-flight modifier."
lp_grid = "Liquidity-provider flight is an assumed modifier of 0%, 30% and 60%, not a measured behaviour."
sell_side_bound = "Collateral that liquidations must sell is bounded by the analyst's dated sell-side capacity per volatile collateral."
h5_slippage_bound = "What liquidators can buy is bounded by the smallest liquidation bonus among the shocked reserves."
gsm_fee_exit = "A GSM counts as an exit at its exit fee, and only where that fee is below the price impact sellers accept."
par_numeraire = "paired assets counted at 1.00 for depth"
shock_grid_fixed = "The shock grid is fixed by the archetype memo, not tuned per token."
lst_discount_grid = "Liquid-staking tokens take an additional discount of 0%, 5% or 10%."
member2_target = "The depeg scenario targets the paired stablecoin named in the frozen pool set."
freeze_reference = "Exit venues are the pool set frozen on the freeze date shown."
additional = "An additional modelling disclosure carried by the stress model; its full text is in the appendix."

