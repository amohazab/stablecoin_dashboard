terminal_other_layer = "terminal_other_layer"
recurses = "disclosure_dependent"
recurses_truncated = "disclosure_dependent"

[tree.bars]
terminal = "Checkable on-chain"
terminal_other_layer = "Checkable one layer down"
disclosure_dependent = "Depends on disclosures"

[charts]
a_title = "Bad debt as the collateral price falls"
a_axis = "fall in volatile collateral prices"
a_y = "bad debt ($)"
b_x = "price impact sellers accept"
b_y = "exit liquidity ($)"
b_title = "Exit liquidity by how much price impact sellers accept"
b_pool = "pool liquidity"
b_gsm = "GSM swap capacity"
