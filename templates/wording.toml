# B-13 ruling H: one plain line per counterfactual id (the table's description rows).
[counterfactual]
H1_kill = "the PegKeepers are switched off and can no longer mint or burn to defend the peg"
EMA_lag = "the oracle lags the market by its moving-average window"
H2_freezer = "the GSM freezer does not act in the depeg scenario, so the GSMs stay open as exit venues"
Tellor_fallback = "the price feed falls back from Chainlink to the Tellor oracle"

# Ruling on the third live run, defect 3: what both `headline.cf.<id>.value_*` rows of a
# line measure, and in what unit - passed to the generator as those rows' label.
[counterfactual_value]
EMA_lag = "upper bound on collateral value eroded by the oracle lag (USD)"
H1_kill = "bad debt with the PegKeepers alive vs switched off (USD)"
H2_freezer = "exit liquidity with the GSM freezer acting vs not acting (USD)"
Tellor_fallback = "no computed value — the line records the price feed's fallback constants and scope"

# Ruling on the third live run: the residual in words, per token (the table's
# `supply.residual.description` row). NAMED DEFAULT: keyed by token; a token without
# a line gets no row.
[residual]
crvUSD = "crvUSD minted but not borrowed, held by the protocol's own contracts, not in circulation; the named causes account for it"
GHO = "residual is supply minus originated debt; 0 here because GHO's originated debt is the sum of its facilitators' bucket levels and every GHO is minted by a facilitator"
LUSD = "residual is supply minus originated debt; 0 here because every LUSD is minted as trove debt, the gas compensation each trove holds included"

# B-13 ruling I: each residual-cause family in words, matched on the family literal's
# opening words; passed to the generator as the rows' labels.
# Ruling 1 on the fourth live run: the label of each `m2.curve.t<t>.s<p>` row.
[m2_curve]
label = "exit liquidity when the paired stablecoin trades at {target}, at a price impact of {impact}"

[residual_families]
"mint-controller pre-mint inventory" = "crvUSD minted into controllers but not yet borrowed — held by the protocol's own contracts, not in circulation"
"PegKeeper undrawn inventory" = "crvUSD a PegKeeper may mint into its pool but has not deployed — held by the protocol, not in circulation"
"mint-market AMM float" = "crvUSD held inside the mint markets' soft-liquidation AMMs — part of borrower positions being converted"
"non-mint-market minting facilitators" = "crvUSD minted by protocol contracts outside the mint markets this report traces — lending factories, the flash lender and the bridge vaults"

# Run 8 ruling 5: what each Level-1 flag means, passed with the open flag to
# flag_explanations (keyed by trigger; rubric §3 owns the trigger's name).
[flag_meaning]
T-02 = "a larger share of the discovered on-chain exchange liquidity sits in venues this report does not model than the rubric allows without a notice; the exit-liquidity figures cover the modelled venues only"
T-20 = "the frozen set of exit pools, chosen at the freeze date, covers less of the discovered pool liquidity than the archetype's coverage target, under a dated waiver; exit liquidity is measured on that set only"

